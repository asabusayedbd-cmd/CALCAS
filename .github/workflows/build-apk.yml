name: Build NaturalCalc APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project directory & Gradle version
        id: project
        run: |
          SETTINGS_PATH=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found!"
            ls -la
            exit 1
          fi
          APP_DIR=$(dirname "$SETTINGS_PATH")
          echo "Found Android project in: $APP_DIR"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

          VER=""
          WRAPPER_PROPS="$APP_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROPS" ]; then
            VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' "$WRAPPER_PROPS" | head -n 1 | sed 's/gradle-//')
          fi
          if [ -z "$VER" ]; then
            VER="9.3.1"
          fi
          echo "Using Gradle version: $VER"
          echo "gradle_ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.project.outputs.gradle_ver }}

      - name: Prepare keystore & env files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cd "${{ steps.project.outputs.app_dir }}"

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f ".env.example" ] && [ ! -f ".env" ]; then
            touch .env.example
          fi

          if [ ! -f "app/google-services.json" ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "${{ steps.project.outputs.app_dir }}"
          if [ -f "gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi
          cp "$APK_FILE" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naturalcalc-apk
          path: app-debug.apk
